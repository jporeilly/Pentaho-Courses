<text x="76" y="33" font-size="14" font-weight="700" fill="#78350f">Record and back up</text>
<text x="76" y="50" font-size="12" fill="#78350f">build, plugins and drivers; plugins to ~/pentaho-backup;</text>
<text x="76" y="65" font-size="12" fill="#78350f">22 GB free, JAVA_HOME set, server stopped</text>
