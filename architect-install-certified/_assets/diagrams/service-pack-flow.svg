<text x="76" y="125" font-size="14" font-weight="700" fill="#3b0764">Run the installer, -i silent</text>
<text x="76" y="142" font-size="12" fill="#3b0764">pentaho-update-11.0.0.3-312.bin</text>
<text x="76" y="157" font-size="12" fill="#3b0764">-DUSER_INSTALL_DIR=/opt/pentaho/server</text>
<rect x="16" y="200" width="470" height="68" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="46" cy="234" r="19" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
