<text x="76" y="309" font-size="14" font-weight="700" fill="#3b0764">It replaces the six products: exit code 0</text>
<text x="76" y="326" font-size="12" fill="#3b0764">Server, Analyzer, Dashboards, Interactive Reporting,</text>
<text x="76" y="341" font-size="12" fill="#3b0764">JDBC Distribution, License Installer</text>
