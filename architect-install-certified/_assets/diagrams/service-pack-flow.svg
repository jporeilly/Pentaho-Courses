<text x="76" y="401" font-size="14" font-weight="700" fill="#14532d">Read what it left</text>
<text x="76" y="418" font-size="12" fill="#14532d">reports and Logs in Pentaho__Installation;</text>
<text x="76" y="433" font-size="12" fill="#14532d">~/.pentaho/backups/11.0.0.0-237-&lt;date&gt;.zip</text>
