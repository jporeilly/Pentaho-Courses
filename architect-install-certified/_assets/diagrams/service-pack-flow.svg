<text x="76" y="224.5" font-size="14" font-weight="700" fill="#3b0764">It scans USER_INSTALL_DIR and backs it up</text>
<text x="76" y="241.5" font-size="12" fill="#3b0764">the whole folder, before it changes anything</text>
<rect x="16" y="292" width="470" height="68" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="46" cy="326" r="19" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
