<text x="78" y="41" font-size="14" font-weight="700" fill="#1e3a8a">Start here: 04 Overview, a reading</text>
<text x="78" y="59" font-size="12" fill="#1e3a8a">why an archive installation, what you'll achieve, the prerequisites and the plan</text>
<text x="30" y="172" font-size="12" fill="#0f172a">• the pentaho user, the Pentaho paths</text>
<text x="30" y="188" font-size="12" fill="#0f172a">• Java 21, PENTAHO_JAVA_HOME</text>
<text x="30" y="204" font-size="12" fill="#0f172a">• PostgreSQL 17, the pentaho role</text>
<text x="30" y="220" font-size="12" fill="#0f172a">• pg_hba.conf to passwords</text>
<text x="30" y="236" font-size="12" fill="#0f172a">• pgAdmin 4, then validate</text>
<rect x="26" y="248" width="220" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
<text x="42" y="263.5" font-size="14" font-weight="700" fill="#0f172a">Java 21, PostgreSQL 17</text>
<text x="42" y="280.5" font-size="12" fill="#0f172a">the validation checks pass</text>
<text x="294" y="172" font-size="12" fill="#3b0764">• unpack 11.0.0.0-237 in /opt/pentaho</text>
<text x="294" y="188" font-size="12" fill="#3b0764">• the jackrabbit, quartz and</text>
<text x="302.5" y="204" font-size="12" fill="#3b0764">hibernate repository databases</text>
<text x="294" y="220" font-size="12" fill="#3b0764">• check the driver and context.xml</text>
<text x="294" y="236" font-size="12" fill="#3b0764">• start, log in, apply the license</text>
<rect x="290" y="248" width="220" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
<text x="306" y="263.5" font-size="14" font-weight="700" fill="#0f172a">Green check marks</text>
<text x="306" y="280.5" font-size="12" fill="#0f172a">in the Licenses table</text>
<text x="558" y="172" font-size="12" fill="#78350f">• Plugin Manager: Analyzer,</text>
<text x="566.5" y="188" font-size="12" fill="#78350f">Interactive Reporting, Dashboard</text>
<text x="566.5" y="204" font-size="12" fill="#78350f">Designer, Semantic Model Editor</text>
<text x="558" y="220" font-size="12" fill="#78350f">• check Pipeline Designer, the</text>
<text x="566.5" y="236" font-size="12" fill="#78350f">Scheduler, Carte; restart</text>
<rect x="554" y="248" width="220" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
<text x="570" y="263.5" font-size="14" font-weight="700" fill="#0f172a">Installed Version</text>
<text x="570" y="280.5" font-size="12" fill="#0f172a">shown for each plugin</text>
<text x="30" y="424" font-size="12" fill="#1e3a8a">• secure: Server header, shutdown</text>
<text x="38.5" y="440" font-size="12" fill="#1e3a8a">port, HTTPS on 8443, autocomplete</text>
<text x="30" y="456" font-size="12" fill="#1e3a8a">• context path and HTTP port</text>
<text x="30" y="472" font-size="12" fill="#1e3a8a">• session timeout, Karaf, CSV limits</text>
<text x="30" y="488" font-size="12" fill="#1e3a8a">• error pages, sample data, widgets</text>
<rect x="26" y="500" width="220" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
<text x="42" y="515.5" font-size="14" font-weight="700" fill="#0f172a">8080/pentaho/Login</text>
<text x="42" y="532.5" font-size="12" fill="#0f172a">put back before the exam</text>
<text x="294" y="424" font-size="12" fill="#3b0764">• record what is installed, back up</text>
<text x="294" y="440" font-size="12" fill="#3b0764">• Pentaho Service Pack Installer,</text>
<text x="302.5" y="456" font-size="12" fill="#3b0764">silent, on /opt/pentaho/server</text>
<text x="294" y="472" font-size="12" fill="#3b0764">• put back SME and your JDBC driver</text>
<text x="294" y="488" font-size="12" fill="#3b0764">• client tools to the same pack</text>
<rect x="290" y="500" width="220" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
<text x="306" y="515.5" font-size="14" font-weight="700" fill="#0f172a">11.0.0.3-312</text>
<text x="306" y="532.5" font-size="12" fill="#0f172a">pentaho-platform-core JAR</text>
<text x="558" y="424" font-size="12" fill="#0f172a">A licensed, hardened and patched</text>
<text x="558" y="440" font-size="12" fill="#0f172a">Pentaho Server on Tomcat 10,</text>
<text x="558" y="456" font-size="12" fill="#0f172a">its repository on PostgreSQL 17:</text>
<text x="558" y="472" font-size="12" fill="#0f172a">the jackrabbit, quartz and</text>
<text x="558" y="488" font-size="12" fill="#0f172a">hibernate databases</text>
<rect x="554" y="500" width="220" height="50" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
<text x="570" y="515.5" font-size="14" font-weight="700" fill="#0f172a">Next: Install Client Tools</text>
<text x="570" y="532.5" font-size="12" fill="#0f172a">Client Plugins, Enterprise Plugins</text>
