<text x="702.6666666666666" y="235.5" text-anchor="middle" font-size="12" fill="#14532d">where a JDBC driver</text>
<text x="702.6666666666666" y="250.5" text-anchor="middle" font-size="12" fill="#14532d">lacks SCRAM</text>
