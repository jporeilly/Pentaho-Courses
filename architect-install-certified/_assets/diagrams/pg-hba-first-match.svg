<text x="528" y="220.5" text-anchor="middle" font-size="12" fill="#14532d">asks for the</text>
<text x="528" y="235.5" text-anchor="middle" font-size="12" fill="#14532d">password; the</text>
<text x="528" y="250.5" text-anchor="middle" font-size="12" fill="#14532d">stronger hash</text>
