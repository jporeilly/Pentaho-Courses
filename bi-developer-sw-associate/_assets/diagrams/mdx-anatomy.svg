<text x="78" y="472" font-size="14" font-weight="700" fill="#14532d">In the SQL, a slicer becomes a condition on the cell query: YEAR_ID = '2004'</text>
<text x="78" y="490" font-size="12" fill="#14532d">the MDX Query workshop's basic query: SELECT Measures.allmembers ON COLUMNS FROM [Sales_2003_2005] WHERE ([Years].[2004])</text>
<text x="550" y="540" text-anchor="middle" font-size="12" fill="#475569">Read the WHERE clause first when a figure surprises you: it changes every number without adding a row or a column.</text>
