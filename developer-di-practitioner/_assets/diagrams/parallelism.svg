<text x="516" y="120.5" font-size="14" font-weight="700" fill="#3b0764">Sort rows</text>
<text x="516" y="137.5" font-size="12" fill="#3b0764">reads and writes</text>
<rect x="692" y="92" width="124" height="76" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
<text x="708" y="113" font-size="14" font-weight="700" fill="#0f172a">Hop</text>
<text x="708" y="130" font-size="12" fill="#0f172a">row buffer,</text>
<text x="708" y="145" font-size="12" fill="#0f172a">up to 10,000 rows</text>
<rect x="876" y="92" width="176" height="76" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="906" cy="130" r="19" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
<g transform="translate(894 118) scale(1)" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 7V5a1 1 0 0 0-1-1H6.5a.5.5 0 0 0-.4.8l4.5 6a2 2 0 0 1 0 2.4l-4.5 6a.5.5 0 0 0 .4.8H17a1 1 0 0 0 1-1v-2"/></g>
<text x="936" y="120.5" font-size="14" font-weight="700" fill="#3b0764">Group by</text>
<text x="936" y="137.5" font-size="12" fill="#3b0764">reads its rows</text>
<rect x="215.75" y="117.5" width="49.5" height="25" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="240.5" y="135.5" text-anchor="middle" font-size="12" fill="#334155">write</text>
<rect x="402.9" y="117.5" width="43.2" height="25" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="424.5" y="135.5" text-anchor="middle" font-size="12" fill="#334155">read</text>
<rect x="635.75" y="117.5" width="49.5" height="25" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="660.5" y="135.5" text-anchor="middle" font-size="12" fill="#334155">write</text>
<rect x="822.9" y="117.5" width="43.2" height="25" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="844.5" y="135.5" text-anchor="middle" font-size="12" fill="#334155">read</text>
<rect x="36" y="202" width="1000" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="56" y="225" font-size="13" font-weight="700" fill="#0f172a">All three steps start together.</text>
<text x="56" y="244" font-size="12" fill="#334155">As soon as Products has written some rows into its hop, Sort rows reads them while Products is still writing, and so on down the line: no step waits for the one before it to finish.</text>
</svg>
