<text x="96" y="120.5" font-size="14" font-weight="700" fill="#1e3a8a">Products</text>
<text x="96" y="137.5" font-size="12" fill="#1e3a8a">writes its rows</text>
<rect x="272" y="92" width="124" height="76" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
<text x="288" y="113" font-size="14" font-weight="700" fill="#0f172a">Hop</text>
<text x="288" y="130" font-size="12" fill="#0f172a">row buffer,</text>
<text x="288" y="145" font-size="12" fill="#0f172a">up to 10,000 rows</text>
<rect x="456" y="92" width="176" height="76" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="486" cy="130" r="19" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
