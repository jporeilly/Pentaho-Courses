<text x="52" y="32" font-size="14" font-weight="700" fill="#ffffff">Parallelism: every step runs at the same time</text>
<text x="52" y="48" font-size="11.5" fill="#ffffff" opacity="0.92">rows stream from step to step through the hops</text>
