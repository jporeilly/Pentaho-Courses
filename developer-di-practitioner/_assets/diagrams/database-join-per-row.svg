<text x="780" y="138.5" font-size="14" font-weight="700" fill="#14532d">PRODUCTS</text>
<text x="780" y="155.5" font-size="12" fill="#14532d">WHERE PRODUCTNAME</text>
<text x="780" y="170.5" font-size="12" fill="#14532d">  LIKE concat('%',?,'%')</text>
<text x="780" y="185.5" font-size="12" fill="#14532d">AND BUYPRICE &lt; ?</text>
