<text x="390" y="138.5" font-size="14" font-weight="700" fill="#3b0764">Database join</text>
<text x="390" y="155.5" font-size="12" fill="#3b0764">one prepared statement,</text>
<text x="390" y="170.5" font-size="12" fill="#3b0764">run once for each row</text>
<text x="390" y="185.5" font-size="12" fill="#3b0764">Outer join? selected</text>
