<text x="633.5" y="142.5" text-anchor="middle" font-size="12" fill="#334155">? ← prod, max_price</text>
<rect x="586.55" y="176.5" width="99.89999999999999" height="25" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="636.5" y="194.5" text-anchor="middle" font-size="12" fill="#334155">matching rows</text>
