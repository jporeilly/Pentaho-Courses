# kettle.properties - the result of the Kettle Variables workshop.
#
# Spoon reads this file from your .kettle folder when it starts:
#   Windows:     C:\Users\<username>\.kettle\kettle.properties
#   Linux/macOS: ~/.kettle/kettle.properties
#
# MERGE the line below into your own file. Do not copy this file over
# yours, or you lose any variables you have already set.
# On Linux/macOS use DIR_SAMPLES=/home/pentaho/Temp instead.

DIR_SAMPLES=C:/Temp
