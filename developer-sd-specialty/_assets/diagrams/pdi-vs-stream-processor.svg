<text x="50" y="36" font-size="14" font-weight="700" fill="#ffffff">Pentaho Data Integration: micro-batches</text>
<text x="50" y="52" font-size="11.5" fill="#ffffff" opacity="0.92">land, check, enrich and load, into almost any target</text>
<rect x="10" y="236" width="1020" height="216" rx="12" fill="#f5f3ff" stroke="#ede9fe" stroke-width="1.5"/>
<path d="M10 248a12 12 0 0 1 12-12h996a12 12 0 0 1 12 12v32h-1020z" fill="#6d28d9"/>
<g transform="translate(23 246) scale(0.8333333333333334)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></g>
<text x="50" y="256" font-size="14" font-weight="700" fill="#ffffff">A stream processor (Flink, Kafka Streams): per event</text>
<text x="50" y="272" font-size="11.5" fill="#ffffff" opacity="0.92">compute over time: windows, joins and running totals</text>
<path d="M252 140L279 140" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M506 140L533 140" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M760 140L787 140" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M252 360L279 360" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M506 360L533 360" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M760 360L787 360" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="26" y="100" width="226" height="80" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="56" cy="140" r="19" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<g transform="translate(44 128) scale(1)" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9"/><path d="M7.8 4.7a6.14 6.14 0 0 0-.8 7.5"/><circle cx="12" cy="9" r="2"/><path d="M16.2 4.8c2 2 2.26 5.11.8 7.47"/><path d="M19.1 1.9a9.96 9.96 0 0 1 0 14.1"/><path d="M9.5 18h5"/><path d="m8 22 4-11 4 11"/></g>
<text x="86" y="123" font-size="14" font-weight="700" fill="#0f172a">Events</text>
<text x="86" y="140" font-size="12" fill="#0f172a">MQTT, AMQP, JMS,</text>
<text x="86" y="155" font-size="12" fill="#0f172a">Kafka, Kinesis</text>
<rect x="280" y="100" width="226" height="80" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="310" cy="140" r="19" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
<g transform="translate(298 128) scale(1)" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></g>
<text x="340" y="123" font-size="14" font-weight="700" fill="#1e3a8a">Consumer step</text>
<text x="340" y="140" font-size="12" fill="#1e3a8a">a batch every N ms</text>
<text x="340" y="155" font-size="12" fill="#1e3a8a">or N records</text>
<rect x="534" y="100" width="226" height="80" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="564" cy="140" r="19" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
<g transform="translate(552 128) scale(1)" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></g>
<text x="594" y="123" font-size="14" font-weight="700" fill="#1e3a8a">Child, once per batch</text>
<text x="594" y="140" font-size="12" fill="#1e3a8a">parse, check, look up, enrich;</text>
<text x="594" y="155" font-size="12" fill="#1e3a8a">starts fresh every batch</text>
<rect x="788" y="100" width="226" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="818" cy="140" r="19" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
<g transform="translate(806 128) scale(1)" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="848" y="123" font-size="14" font-weight="700" fill="#14532d">Many targets</text>
<text x="848" y="140" font-size="12" fill="#14532d">databases, files, object</text>
<text x="848" y="155" font-size="12" fill="#14532d">stores, topics, APIs</text>
<rect x="26" y="320" width="226" height="80" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="56" cy="360" r="19" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<g transform="translate(44 348) scale(1)" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9"/><path d="M7.8 4.7a6.14 6.14 0 0 0-.8 7.5"/><circle cx="12" cy="9" r="2"/><path d="M16.2 4.8c2 2 2.26 5.11.8 7.47"/><path d="M19.1 1.9a9.96 9.96 0 0 1 0 14.1"/><path d="M9.5 18h5"/><path d="m8 22 4-11 4 11"/></g>
<text x="86" y="350.5" font-size="14" font-weight="700" fill="#0f172a">Events</text>
<text x="86" y="367.5" font-size="12" fill="#0f172a">usually from Kafka</text>
<rect x="280" y="320" width="226" height="80" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="310" cy="360" r="19" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
<g transform="translate(298 348) scale(1)" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g>
<text x="340" y="350.5" font-size="14" font-weight="700" fill="#3b0764">Each event, at once</text>
<text x="340" y="367.5" font-size="12" fill="#3b0764">no batch to wait for</text>
<rect x="534" y="320" width="226" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="564" cy="360" r="19" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<g transform="translate(552 348) scale(1)" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></g>
<text x="594" y="343" font-size="14" font-weight="700" fill="#78350f">Keyed state</text>
<text x="594" y="360" font-size="12" fill="#78350f">windows and joins over time,</text>
<text x="594" y="375" font-size="12" fill="#78350f">kept and checkpointed</text>
<rect x="788" y="320" width="226" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="818" cy="360" r="19" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
<g transform="translate(806 348) scale(1)" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g>
<text x="848" y="343" font-size="14" font-weight="700" fill="#14532d">Output streams</text>
<text x="848" y="360" font-size="12" fill="#14532d">alerts, aggregates,</text>
<text x="848" y="375" font-size="12" fill="#14532d">enriched topics</text>
<rect x="10" y="472" width="1020" height="60" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="42" cy="502" r="19" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<g transform="translate(30 490) scale(1)" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></g>
<text x="72" y="499" font-size="14" font-weight="700" fill="#0f172a">Often both: the stream processor computes over time, and Pentaho Data Integration lands its output</text>
<text x="72" y="517" font-size="12" fill="#0f172a">in the warehouse, the lake and the systems of record, with the same steps as every batch job</text>
</svg>
