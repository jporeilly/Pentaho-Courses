<rect x="191.35000000000002" y="87.5" width="150.29999999999998" height="25" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="266.5" y="105.5" text-anchor="middle" font-size="12" fill="#334155">1  open the dashboard</text>
<rect x="302.8" y="130" width="194.4" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="400" y="148" text-anchor="middle" font-size="12" fill="#334155">each layout row and column</text>
<text x="400" y="163" text-anchor="middle" font-size="12" fill="#334155">becomes a div, id = its Name</text>
<rect x="172.3" y="186" width="194.4" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="269.5" y="204" text-anchor="middle" font-size="12" fill="#334155">2  the page: the layout divs</text>
<text x="269.5" y="219" text-anchor="middle" font-size="12" fill="#334155">and the dashboard's script</text>
<rect x="35.650000000000006" y="242" width="200.7" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="136" y="260" text-anchor="middle" font-size="12" fill="#334155">3  load the CDF modules</text>
<text x="136" y="275" text-anchor="middle" font-size="12" fill="#334155">(RequireJS, if Support is on)</text>
<rect x="45.10000000000001" y="298.5" width="181.79999999999998" height="55" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="136" y="316.5" text-anchor="middle" font-size="12" fill="#334155">4  init(): every component</text>
<text x="136" y="331.5" text-anchor="middle" font-size="12" fill="#334155">created; Execute at Start</text>
<text x="136" y="346.5" text-anchor="middle" font-size="12" fill="#334155">ones run, by Priority</text>
<rect x="35.650000000000006" y="379.5" width="200.7" height="25" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="136" y="397.5" text-anchor="middle" font-size="12" fill="#334155">5  preExecution: false = skip</text>
<rect x="425.35" y="420" width="213.29999999999998" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="532" y="438" text-anchor="middle" font-size="12" fill="#334155">6  doQuery: path, dataAccessId,</text>
<text x="532" y="453" text-anchor="middle" font-size="12" fill="#334155">param&lt;name&gt;=&lt;value&gt;</text>
<rect x="469.45" y="481.5" width="125.1" height="25" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="532" y="499.5" text-anchor="middle" font-size="12" fill="#334155">7  the rows, json</text>
<rect x="35.650000000000006" y="522" width="200.7" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="136" y="540" text-anchor="middle" font-size="12" fill="#334155">8  postFetch, then it renders</text>
<text x="136" y="555" text-anchor="middle" font-size="12" fill="#334155">into its HtmlObject div</text>
<rect x="48.25" y="596" width="175.5" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="136" y="614" text-anchor="middle" font-size="12" fill="#334155">9  a selector or a click:</text>
<text x="136" y="629" text-anchor="middle" font-size="12" fill="#334155">the parameter changes</text>
<rect x="431.65" y="648" width="200.7" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="532" y="666" text-anchor="middle" font-size="12" fill="#334155">10  each listener runs again:</text>
<text x="532" y="681" text-anchor="middle" font-size="12" fill="#334155">doQuery, the new value</text>
<rect x="441.1" y="701.5" width="181.79999999999998" height="25" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="532" y="719.5" text-anchor="middle" font-size="12" fill="#334155">11  rows; it renders again</text>
