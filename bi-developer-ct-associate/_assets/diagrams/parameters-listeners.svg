<text x="78" y="500" font-size="14" font-weight="700" fill="#3b0764">CDA doQuery runs the component's query</text>
<text x="78" y="518" font-size="12" fill="#3b0764">each entry in its Parameters arrives as param&lt;name&gt;=&lt;value&gt;, e.g. paramproductLineParameter</text>
