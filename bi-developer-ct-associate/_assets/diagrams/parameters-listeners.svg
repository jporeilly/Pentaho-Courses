<text x="92" y="205" font-size="14" font-weight="700" fill="#78350f">Pie slice click</text>
<text x="92" y="222" font-size="12" fill="#78350f">Click Action calls</text>
<text x="92" y="237" font-size="12" fill="#78350f">dashboard.fireChange</text>
<rect x="290" y="92" width="258" height="160" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="320" cy="172" r="19" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
