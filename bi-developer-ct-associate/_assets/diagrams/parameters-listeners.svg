<text x="350" y="140" font-size="14" font-weight="700" fill="#134e4a">The parameter changes</text>
<text x="350" y="157" font-size="12" fill="#134e4a">set to the new value;</text>
<text x="350" y="172" font-size="12" fill="#134e4a">event cdf &lt;name&gt;:fireChange;</text>
<text x="350" y="187" font-size="12" fill="#134e4a">then each enabled component</text>
<text x="350" y="202" font-size="12" fill="#134e4a">listening to it updates</text>
<rect x="560" y="92" width="208" height="160" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="590" cy="172" r="19" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<g transform="translate(578 160) scale(1)" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0"/><path d="M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4"/></g>
<text x="620" y="140" font-size="14" font-weight="700" fill="#0f172a">Needs both</text>
<text x="620" y="157" font-size="12" fill="#0f172a">Listeners: run again</text>
<text x="620" y="172" font-size="12" fill="#0f172a">when it changes</text>
<text x="620" y="187" font-size="12" fill="#0f172a">Parameters: send</text>
<text x="620" y="202" font-size="12" fill="#0f172a">its value to the query</text>
<rect x="32" y="316" width="232" height="96" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="62" cy="364" r="19" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
<g transform="translate(50 352) scale(1)" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></g>
<text x="92" y="339.5" font-size="14" font-weight="700" fill="#1e3a8a">Listeners + Parameters</text>
<text x="92" y="356.5" font-size="12" fill="#1e3a8a">lineChart: runs again</text>
<text x="92" y="371.5" font-size="12" fill="#1e3a8a">and sends the new value:</text>
<text x="92" y="386.5" font-size="12" fill="#1e3a8a">redraws with new data</text>
<rect x="284" y="316" width="232" height="96" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="314" cy="364" r="19" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
<g transform="translate(302 352) scale(1)" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></g>
<text x="344" y="339.5" font-size="14" font-weight="700" fill="#7f1d1d">Listeners only</text>
<text x="344" y="356.5" font-size="12" fill="#7f1d1d">runs again, value not sent:</text>
<text x="344" y="371.5" font-size="12" fill="#7f1d1d">updates with old data</text>
<text x="344" y="386.5" font-size="12" fill="#7f1d1d">= missing Parameters</text>
<rect x="536" y="316" width="232" height="96" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="566" cy="364" r="19" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
<g transform="translate(554 352) scale(1)" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></g>
<text x="596" y="339.5" font-size="14" font-weight="700" fill="#7f1d1d">Parameters only</text>
<text x="596" y="356.5" font-size="12" fill="#7f1d1d">never told of the change:</text>
<text x="596" y="371.5" font-size="12" fill="#7f1d1d">never updates</text>
<text x="596" y="386.5" font-size="12" fill="#7f1d1d">= missing Listener</text>
<rect x="16" y="466" width="768" height="74" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="48" cy="503" r="19" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
