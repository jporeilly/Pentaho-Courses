# Multi-replica Pentaho Server. DRAFT, NOT READY TO RUN: the shared
# Jackrabbit journal needs a unique id per node, but the image's
# repository.xml fixes <Cluster id="node1"> for every pod, and the
# CATALINA_OPTS below is replaced by the archive's start-pentaho.sh. Both
# have to be solved before two replicas can share a repository.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pentaho-server-ha
  namespace: pentaho
spec:
  replicas: 2
  selector:
    matchLabels: { app: pentaho-server-ha }
  template:
    metadata:
      labels: { app: pentaho-server-ha }
    spec:
      containers:
        - name: pentaho-server
          image: localhost/pentaho/pentaho-server:11.0.0.0-237
          ports: [{ containerPort: 8080 }]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: CATALINA_OPTS
              value: "-Drep.cluster.id=$(POD_NAME)"
          readinessProbe:
            httpGet: { path: /pentaho/Login, port: 8080 }
            initialDelaySeconds: 120
            periodSeconds: 15
