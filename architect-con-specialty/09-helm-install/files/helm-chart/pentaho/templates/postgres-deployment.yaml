{{/* Deploys PostgreSQL 15 database server with automatic initialization and persistent storage */}}
{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ include "pentaho.namespace" . }}
  labels:
    {{- include "pentaho.postgresql.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.postgresql.replicas }}
  strategy:
    type: {{ .Values.postgresql.strategy.type }}
  selector:
    matchLabels:
      {{- include "pentaho.postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pentaho.postgresql.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.postgresql.service.targetPort }}
              name: postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pentaho.secretName" . }}
                  key: postgres-password
            - name: PGDATA
              value: {{ .Values.postgresql.persistence.pgdata }}
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
          volumeMounts:
            {{- if .Values.postgresql.persistence.enabled }}
            - name: postgres-data
              mountPath: {{ .Values.postgresql.persistence.dataPath }}
            {{- end }}
            {{- if .Values.postgresql.initScripts.enabled }}
            - name: postgres-init
              mountPath: {{ .Values.postgresql.initScripts.mountPath }}
            {{- end }}
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          {{- if .Values.postgresql.probes.liveness.enabled }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: {{ .Values.postgresql.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.postgresql.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.postgresql.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.postgresql.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.postgresql.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: {{ .Values.postgresql.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.postgresql.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.postgresql.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.postgresql.probes.readiness.failureThreshold }}
          {{- end }}
      volumes:
        {{- if .Values.postgresql.persistence.enabled }}
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data-pvc
        {{- end }}
        {{- if .Values.postgresql.initScripts.enabled }}
        - name: postgres-init
          configMap:
            name: postgres-init-scripts
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
