{{/*
=============================================================================
SECRET TEMPLATE
=============================================================================
Stores sensitive database credentials (passwords) encrypted in Kubernetes.

Purpose:
  - Securely stores database authentication credentials
  - Base64 encodes sensitive data automatically
  - Prevents credentials from appearing in pod specs or logs
  - Enables credential rotation without changing deployments

Security Notes:
  - Secrets are base64 encoded (NOT encrypted) by default in etcd
  - For production: Enable encryption at rest in Kubernetes
  - Use external secret managers (HashiCorp Vault, AWS Secrets Manager)
  - Never commit real passwords to version control

Credentials Stored:
  - PostgreSQL superuser password (postgres)
  - JCR (JackRabbit) content repository database credentials
  - Quartz scheduler database credentials
  - Hibernate ORM database credentials

Configuration:
  - Set passwords in values.yaml: database.auth.*
  - Disable with: security.createSecrets: false
  - Use existing secret: security.existingSecret: "secret-name"
=============================================================================
*/}}
{{- if .Values.security.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  # Secret name referenced by deployments
  name: {{ include "pentaho.secretName" . }}
  namespace: {{ include "pentaho.namespace" . }}
  labels:
    {{- include "pentaho.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Opaque type = arbitrary user-defined data (most common)
type: Opaque
# stringData = plain text automatically base64 encoded by Kubernetes
stringData:
  # PostgreSQL superuser password (for database administration)
  postgres-password: {{ .Values.database.auth.postgresPassword | quote }}

  # JCR (JackRabbit) database credentials
  # Used for content repository storage (files, folders, permissions)
  jcr-user: {{ .Values.database.auth.jcrUser | quote }}
  jcr-password: {{ .Values.database.auth.jcrPassword | quote }}
  jcr-database: {{ .Values.database.auth.jcrDatabase | quote }}

  # Quartz scheduler database credentials
  # Used for job scheduling and trigger management
  quartz-user: {{ .Values.database.auth.quartzUser | quote }}
  quartz-password: {{ .Values.database.auth.quartzPassword | quote }}
  quartz-database: {{ .Values.database.auth.quartzDatabase | quote }}

  # Hibernate repository database credentials
  # Used for ORM-based data persistence (users, roles, settings)
  hibernate-user: {{ .Values.database.auth.hibernateUser | quote }}
  hibernate-password: {{ .Values.database.auth.hibernatePassword | quote }}
  hibernate-database: {{ .Values.database.auth.hibernateDatabase | quote }}
{{- end }}
