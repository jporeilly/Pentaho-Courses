services:
  # PostgreSQL Database (same as K3s)
  postgres:
    image: docker.io/library/postgres:15
    container_name: pentaho-k3s-postgresql
    environment:
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: America/New_York
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - pentaho-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Initialize PostgreSQL databases using SQL scripts from working project
  # Note: These scripts create users, databases, and all required tables including Quartz locks
  #
  # No depends_on here: the job waits for PostgreSQL itself, below. Podman 4.9
  # (Ubuntu 24.04's) cannot start a container whose dependency has exited
  # while that dependency's own dependency is still running, which is what
  # pentaho-server -> postgres-init -> postgres would be once this job ends.
  #
  # And it does nothing when the databases exist: Podman starts every
  # container a service depends on whenever that service starts, so this job
  # runs again with each start of pentaho-server, and the first and third
  # scripts begin with drop database.
  postgres-init:
    image: docker.io/library/postgres:15
    environment:
      PGPASSWORD: password
    volumes:
      # The five repository scripts from the Compose workshop, copied in
      # beside this file
      - ./db_init_postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - pentaho-test
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until pg_isready -h postgres -U postgres -q; do
          echo 'Waiting for PostgreSQL...'
          sleep 2
        done
        found=$$(psql -h postgres -U postgres -tAc "select count(*) from pg_database where datname in ('hibernate','jackrabbit','quartz')")
        if [ "$$found" = "3" ]; then
          echo 'The repository databases exist already: nothing to do.'
          exit 0
        fi
        echo 'Running the PostgreSQL repository scripts...'
        # Execute SQL files in order (already numbered: 1_, 2_, 3_, 4_, 5_)
        for sql_file in /docker-entrypoint-initdb.d/*.sql; do
          if [ -f "$$sql_file" ]; then
            echo "Executing: $$(basename $$sql_file)"
            # Run without prompting for password (uses PGPASSWORD env var)
            psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f "$$sql_file" || {
              echo "Error executing $$sql_file"
              exit 1
            }
          fi
        done
        echo 'Database initialization complete!'
    restart: "no"

  # Pentaho Server (using our built image)
  pentaho-server:
    image: pentaho/pentaho-server:11.0.0.0-237
    container_name: pentaho-k3s-server
    hostname: pentaho-server
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    environment:
      - PENTAHO_MIN_MEMORY=2048m
      - PENTAHO_MAX_MEMORY=4096m
      - PENTAHO_SERVER_PATH=/opt/pentaho/pentaho-server
      - INSTALLATION_PATH=/opt/pentaho
      - DB_TYPE=postgres
      - TZ=America/New_York
    ports:
      - "8080:8080"
      - "8443:8443"
    networks:
      - pentaho-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/pentaho/Login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

networks:
  pentaho-test:
    driver: bridge

volumes:
  postgres_test_data:
    driver: local
