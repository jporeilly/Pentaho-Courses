<rect x="140.95" y="72.5" width="125.1" height="55" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="203.5" y="90.5" text-anchor="middle" font-size="12" fill="#334155">1  Table input,</text>
<text x="203.5" y="105.5" text-anchor="middle" font-size="12" fill="#334155">Read Log Entries:</text>
<text x="203.5" y="120.5" text-anchor="middle" font-size="12" fill="#334155">processed = 0</text>
<rect x="150.55" y="139.5" width="99.89999999999999" height="25" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="200.5" y="157.5" text-anchor="middle" font-size="12" fill="#334155">5 log entries</text>
<rect x="137.8" y="176.5" width="131.39999999999998" height="55" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="203.5" y="194.5" text-anchor="middle" font-size="12" fill="#334155">2  Database join,</text>
<text x="203.5" y="209.5" text-anchor="middle" font-size="12" fill="#334155">Get Asset History:</text>
<text x="203.5" y="224.5" text-anchor="middle" font-size="12" fill="#334155">by asset_id</text>
<rect x="144.25" y="243.5" width="112.5" height="25" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="200.5" y="261.5" text-anchor="middle" font-size="12" fill="#334155">23 history rows</text>
<rect x="200.2" y="286.5" width="219.6" height="55" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="310" y="304.5" text-anchor="middle" font-size="12" fill="#334155">3  Sort rows, Remove Duplicates,</text>
<text x="310" y="319.5" text-anchor="middle" font-size="12" fill="#334155">Aggregate History, Group by:</text>
<text x="310" y="334.5" text-anchor="middle" font-size="12" fill="#334155">one row per entry, history_json</text>
<rect x="228.55" y="356" width="162.9" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="310" y="374" text-anchor="middle" font-size="12" fill="#334155">4  Build Agent Payload:</text>
<text x="310" y="389" text-anchor="middle" font-size="12" fill="#334155">agent_payload</text>
<rect x="342.05" y="410" width="162.9" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="423.5" y="428" text-anchor="middle" font-size="12" fill="#334155">5  POST /assess</text>
<text x="423.5" y="443" text-anchor="middle" font-size="12" fill="#334155">(Call Assessment Agent)</text>
<rect x="461.7" y="462.5" width="156.6" height="55" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="540" y="480.5" text-anchor="middle" font-size="12" fill="#334155">6  check the body;</text>
<text x="540" y="495.5" text-anchor="middle" font-size="12" fill="#334155">build_prompt: history,</text>
<text x="540" y="510.5" text-anchor="middle" font-size="12" fill="#334155">then the current entry</text>
<rect x="577.55" y="532" width="99.89999999999999" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="627.5" y="550" text-anchor="middle" font-size="12" fill="#334155">7  one call:</text>
<text x="627.5" y="565" text-anchor="middle" font-size="12" fill="#334155">/api/generate</text>
<rect x="586.85" y="585.5" width="87.3" height="25" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="630.5" y="603.5" text-anchor="middle" font-size="12" fill="#334155">JSON answer</text>
<rect x="452.25" y="620" width="175.5" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="540" y="638" text-anchor="middle" font-size="12" fill="#334155">8  force priority and</text>
<text x="540" y="653" text-anchor="middle" font-size="12" fill="#334155">pattern to allowed values</text>
<rect x="345.05" y="674" width="162.9" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="426.5" y="692" text-anchor="middle" font-size="12" fill="#334155">9  200, and seven keys:</text>
<text x="426.5" y="707" text-anchor="middle" font-size="12" fill="#334155">priority, pattern, …</text>
<rect x="215.95" y="728" width="188.1" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="310" y="746" text-anchor="middle" font-size="12" fill="#334155">10  Filter rows, Check HTTP</text>
<text x="310" y="761" text-anchor="middle" font-size="12" fill="#334155">Status: response_code = 200</text>
<rect x="206.5" y="783.5" width="207" height="25" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
<text x="310" y="801.5" text-anchor="middle" font-size="12" fill="#7f1d1d">other codes: Write HTTP Errors</text>
<rect x="200.2" y="824" width="219.6" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="310" y="842" text-anchor="middle" font-size="12" fill="#334155">11  Parse Agent Response;</text>
<text x="310" y="857" text-anchor="middle" font-size="12" fill="#334155">Switch / case, Route by Priority</text>
<rect x="115.75" y="876.5" width="175.5" height="55" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="203.5" y="894.5" text-anchor="middle" font-size="12" fill="#334155">12  Table output, Write</text>
<text x="203.5" y="909.5" text-anchor="middle" font-size="12" fill="#334155">CRITICAL, HIGH, MEDIUM</text>
<text x="203.5" y="924.5" text-anchor="middle" font-size="12" fill="#334155">or LOW: into assessed_log</text>
</svg>
