<path d="M408 28a12 12 0 0 1 12-12h352a12 12 0 0 1 12 12v32h-376z" fill="#1d4ed8"/>
<text x="424" y="36" font-size="14" font-weight="700" fill="#ffffff">Metadata Discovery</text>
<text x="424" y="52" font-size="11.5" fill="#ffffff" opacity="0.92">what a document says about itself</text>
<rect x="408" y="164" width="376" height="140" rx="12" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.5"/>
<path d="M408 176a12 12 0 0 1 12-12h352a12 12 0 0 1 12 12v32h-376z" fill="#1d4ed8"/>
<text x="424" y="184" font-size="14" font-weight="700" fill="#ffffff">Transform</text>
<text x="424" y="200" font-size="11.5" fill="#ffffff" opacity="0.92">images for AI Chat</text>
<rect x="16" y="320" width="768" height="360" rx="12" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.5"/>
<path d="M16 332a12 12 0 0 1 12-12h744a12 12 0 0 1 12 12v32h-768z" fill="#1d4ed8"/>
<text x="32" y="340" font-size="14" font-weight="700" fill="#ffffff">AI</text>
<text x="32" y="356" font-size="11.5" fill="#ffffff" opacity="0.92">eight steps: models, embeddings, vector stores, tools and entities</text>
<rect x="28" y="72" width="352" height="64" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="58" cy="104" r="19" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
<g transform="translate(46 92) scale(1)" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></g>
<text x="88" y="87" font-size="14" font-weight="700" fill="#1e3a8a">HTML Parser</text>
<text x="88" y="104" font-size="12" fill="#1e3a8a">the text of HTML or XML, by XPath</text>
<text x="88" y="119" font-size="12" fill="#1e3a8a">or CSS selector. Lab 03</text>
<rect x="28" y="148" width="352" height="64" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="58" cy="180" r="19" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
<g transform="translate(46 168) scale(1)" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g>
<text x="88" y="163" font-size="14" font-weight="700" fill="#1e3a8a">Read Unstructured Document</text>
<text x="88" y="180" font-size="12" fill="#1e3a8a">TXT, PDF, DOC(X), PPT(X), with</text>
<text x="88" y="195" font-size="12" fill="#1e3a8a">a password. Labs 04, 10, 20, 25</text>
<rect x="28" y="224" width="352" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="58" cy="256" r="19" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<g transform="translate(46 244) scale(1)" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></g>
<text x="88" y="239" font-size="14" font-weight="700" fill="#0f172a">Apache Tika and jsoup</text>
<text x="88" y="256" font-size="12" fill="#0f172a">Tika reads the documents and</text>
<text x="88" y="271" font-size="12" fill="#0f172a">their metadata; jsoup reads HTML</text>
<rect x="420" y="72" width="352" height="64" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="450" cy="104" r="19" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
<g transform="translate(438 92) scale(1)" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.172 2a2 2 0 0 1 1.414.586l6.71 6.71a2.4 2.4 0 0 1 0 3.408l-4.592 4.592a2.4 2.4 0 0 1-3.408 0l-6.71-6.71A2 2 0 0 1 6 9.172V3a1 1 0 0 1 1-1z"/><path d="M2 7v6.172a2 2 0 0 0 .586 1.414l6.71 6.71a2.4 2.4 0 0 0 3.191.193"/><circle cx="10.5" cy="6.5" r=".5" fill="currentColor"/></g>
<text x="480" y="87" font-size="14" font-weight="700" fill="#3b0764">Discover Metadata from</text>
<text x="480" y="104" font-size="12" fill="#3b0764">Unstructured Documents: one row</text>
<text x="480" y="119" font-size="12" fill="#3b0764">per key, such as dc:creator. Lab 04</text>
<rect x="420" y="220" width="352" height="64" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="450" cy="252" r="19" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
<g transform="translate(438 240) scale(1)" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 12.5 8 15l2 2.5"/><path d="m14 12.5 2 2.5-2 2.5"/></g>
<text x="480" y="235" font-size="14" font-weight="700" fill="#3b0764">Base64 Encoder</text>
<text x="480" y="252" font-size="12" fill="#3b0764">a file or a value as Base64 text, to</text>
<text x="480" y="267" font-size="12" fill="#3b0764">send images to AI Chat. Lab 26</text>
<rect x="28" y="376" width="360" height="64" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="58" cy="408" r="19" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
<g transform="translate(46 396) scale(1)" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"/></g>
<text x="88" y="391" font-size="14" font-weight="700" fill="#3b0764">AI Chat</text>
<text x="88" y="408" font-size="12" fill="#3b0764">a prompt to an LLM, its answer back;</text>
<text x="88" y="423" font-size="12" fill="#3b0764">MCP tools. Labs 06 to 11, 21, 22, 25 to 29</text>
<rect x="412" y="376" width="360" height="64" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="442" cy="408" r="19" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
<g transform="translate(430 396) scale(1)" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/></g>
<text x="472" y="391" font-size="14" font-weight="700" fill="#3b0764">AI Chat Message Box</text>
<text x="472" y="408" font-size="12" fill="#3b0764">a prompt and a run instruction</text>
<text x="472" y="423" font-size="12" fill="#3b0764">as two fields. Labs 05, 08</text>
<rect x="28" y="452" width="360" height="64" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="58" cy="484" r="19" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
<g transform="translate(46 472) scale(1)" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></g>
<text x="88" y="467" font-size="14" font-weight="700" fill="#3b0764">AI Segmentation</text>
<text x="88" y="484" font-size="12" fill="#3b0764">a long text into chunks,</text>
<text x="88" y="499" font-size="12" fill="#3b0764">one row each. Labs 10, 20, 25</text>
<rect x="412" y="452" width="360" height="64" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="442" cy="484" r="19" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
<g transform="translate(430 472) scale(1)" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="4" height="6" rx="2"/><rect x="6" y="4" width="4" height="6" rx="2"/><path d="M6 20h4"/><path d="M14 10h4"/><path d="M6 14h2v6"/><path d="M14 4h2v6"/></g>
<text x="472" y="467" font-size="14" font-weight="700" fill="#134e4a">Text to Vector</text>
<text x="472" y="484" font-size="12" fill="#134e4a">text into an embedding with an</text>
<text x="472" y="499" font-size="12" fill="#134e4a">embedding model. Labs 20, 21, 25, 27</text>
<rect x="28" y="528" width="360" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="58" cy="560" r="19" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
<g transform="translate(46 548) scale(1)" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="88" y="543" font-size="14" font-weight="700" fill="#14532d">Vector Writer</text>
<text x="88" y="560" font-size="12" fill="#14532d">embeddings, text and metadata</text>
<text x="88" y="575" font-size="12" fill="#14532d">into a vector store. Labs 20, 25</text>
<rect x="412" y="528" width="360" height="64" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="442" cy="560" r="19" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<g transform="translate(430 548) scale(1)" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H3"/><path d="M10 12H3"/><path d="M10 19H3"/><circle cx="17" cy="15" r="3"/><path d="m21 19-1.9-1.9"/></g>
<text x="472" y="543" font-size="14" font-weight="700" fill="#78350f">Vector Search</text>
<text x="472" y="560" font-size="12" fill="#78350f">the stored texts closest to</text>
<text x="472" y="575" font-size="12" fill="#78350f">a query's embedding. Labs 21, 25, 27</text>
<rect x="28" y="604" width="360" height="64" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="58" cy="636" r="19" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
<g transform="translate(46 624) scale(1)" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z"/><path d="m2 22 3-3"/><path d="M7.5 13.5 10 11"/><path d="M10.5 16.5 13 14"/><path d="m18 3-4 4h6l-4 4"/></g>
<text x="88" y="619" font-size="14" font-weight="700" fill="#3b0764">MCP Client</text>
<text x="88" y="636" font-size="12" fill="#3b0764">lists and calls the tools of</text>
<text x="88" y="651" font-size="12" fill="#3b0764">an MCP server. Labs 22, 29</text>
<rect x="412" y="604" width="360" height="64" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="442" cy="636" r="19" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
<g transform="translate(430 624) scale(1)" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8h8"/><path d="M7 12h10"/><path d="M7 16h6"/></g>
<text x="472" y="619" font-size="14" font-weight="700" fill="#3b0764">NER Extractor</text>
<text x="472" y="636" font-size="12" fill="#3b0764">named entities with Stanford</text>
<text x="472" y="651" font-size="12" fill="#3b0764">CoreNLP, no LLM. Labs 09, 28</text>
<rect x="16" y="696" width="768" height="64" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="48" cy="728" r="19" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<g transform="translate(36 716) scale(1)" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text x="78" y="725" font-size="14" font-weight="700" fill="#0f172a">Every step: its own pdi-step-... folder in data-integration\plugins, version 1.2.0-157</text>
<text x="78" y="743" font-size="12" fill="#0f172a">and a Pentaho EE license with GenAI (GENAI-EE) rights, checked when the transformation starts</text>
