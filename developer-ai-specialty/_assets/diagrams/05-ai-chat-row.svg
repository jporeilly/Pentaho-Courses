<text x="88" y="423" font-size="14" font-weight="700" fill="#14532d">The row, with new fields</text>
<text x="88" y="440" font-size="12" fill="#14532d">$.sentiment becomes sentiment;</text>
<text x="88" y="455" font-size="12" fill="#14532d">a missing key becomes null</text>
