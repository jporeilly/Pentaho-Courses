# AI Pipelines on Pentaho Server: the settings the RAG transformations read.
# Add these lines to the kettle.properties file of the Windows account that runs
# the Pentaho Server, then restart the server: it reads the file when it starts.
# Paths use forward slashes: a backslash is an escape character in this file.
OLLAMA_URL=http://localhost:11434
MODEL_NAME=llama3.2:3b
PG_HOST=localhost
PG_PORT=5433
PG_DATABASE=genai
PG_USER=genai
PG_PASSWORD=genai
RAG_DATA_DIR=C:/Workshop-AI-Specialty/08-moving-to-production/25-production-server/data
RAG_OUT_DIR=C:/Workshop-AI-Specialty/08-moving-to-production/25-production-server/out
