<text x="140" y="98" text-anchor="middle" font-size="12" fill="#334155">0  Scheduler, daily 02:00 UTC,</text>
<text x="140" y="113" text-anchor="middle" font-size="12" fill="#334155">or Webhook (Public URL)</text>
<rect x="177.60000000000002" y="138.5" width="181.79999999999998" height="55" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="268.5" y="156.5" text-anchor="middle" font-size="12" fill="#334155">1  HTTP Client: GET runJob</text>
<text x="268.5" y="171.5" text-anchor="middle" font-size="12" fill="#334155">job=/ETL/LoadCustomer.kjb</text>
<text x="268.5" y="186.5" text-anchor="middle" font-size="12" fill="#334155">level=Basic</text>
<rect x="597.45" y="202" width="125.1" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="660" y="220" text-anchor="middle" font-size="12" fill="#334155">starts the job on</text>
<text x="660" y="235" text-anchor="middle" font-size="12" fill="#334155">its own thread</text>
<rect x="465.8" y="258" width="131.39999999999998" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="531.5" y="276" text-anchor="middle" font-size="12" fill="#334155">2  webresult: OK</text>
<text x="531.5" y="291" text-anchor="middle" font-size="12" fill="#334155">and the job’s &lt;id&gt;</text>
<rect x="83.75" y="314" width="112.5" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="140" y="332" text-anchor="middle" font-size="12" fill="#334155">3  Script step:</text>
<text x="140" y="347" text-anchor="middle" font-size="12" fill="#334155">jobId from &lt;id&gt;</text>
<rect x="168.15" y="416" width="200.7" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="268.5" y="434" text-anchor="middle" font-size="12" fill="#334155">4  HTTP Client: GET jobStatus</text>
<text x="268.5" y="449" text-anchor="middle" font-size="12" fill="#334155">name=LoadCustomer, id=jobId</text>
<rect x="453.2" y="478" width="156.6" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="531.5" y="496" text-anchor="middle" font-size="12" fill="#334155">5  status_desc:</text>
<text x="531.5" y="511" text-anchor="middle" font-size="12" fill="#334155">Running until Finished</text>
<rect x="77.45" y="546" width="125.1" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="140" y="564" text-anchor="middle" font-size="12" fill="#334155">6  Delay 10 s,</text>
<text x="140" y="579" text-anchor="middle" font-size="12" fill="#334155">Boolean condition</text>
<rect x="33.35000000000001" y="632.5" width="213.29999999999998" height="55" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="140" y="650.5" text-anchor="middle" font-size="12" fill="#334155">7  Slack (or email, Jira):</text>
<text x="140" y="665.5" text-anchor="middle" font-size="12" fill="#334155">Pentaho ETL job completed</text>
<text x="140" y="680.5" text-anchor="middle" font-size="12" fill="#334155">successfully; errors branch off</text>
